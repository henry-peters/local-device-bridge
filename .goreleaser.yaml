version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: bridge
    main: ./cmd/local-device-bridge
    binary: local-device-bridge
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
